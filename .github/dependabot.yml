version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Prefer SHA-pinned updates. Review action PRs carefully after tj-actions-style incidents.
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
