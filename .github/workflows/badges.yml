# Regenerate shields.io endpoint JSON and publish it to the badges branch.
name: Badges

on:
  push:
    branches:
      - master
      - main
    paths:
      - "badges/theme.json"
      - "go.mod"
      - "scripts/gen-badges.sh"
      - ".github/workflows/badges.yml"
  release:
    types: [published]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh endpoint badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the generated JSON to the badges branch
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          VER="${RAW#v}"
          echo "version=${VER:-untagged}" >> "$GITHUB_OUTPUT"

      - name: Generate badges
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/gen-badges.sh

      - name: Publish badge endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK="$(pwd)"
          PUB="$(mktemp -d)"
          cp -a badges/. "$PUB/"
          cd "$PUB"
          git init -q
          git checkout -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .
          if git fetch -q --depth=1 origin badges && \
             [ "$(git write-tree)" = "$(git rev-parse -q --verify FETCH_HEAD^{tree})" ]; then
            echo "badges branch already up to date"
            exit 0
          fi
          git commit -qm "chore: refresh dynamic shields badges"
          git push --force origin HEAD:badges
          cd "$WORK"
          rm -rf "$PUB"
