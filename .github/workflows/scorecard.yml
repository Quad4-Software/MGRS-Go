# OpenSSF Scorecard supply-chain posture checks.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1"
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Do not cancel in-progress runs. A cancelled Scorecard suite marks the
# commit status rollup as FAILURE even when CI and CodeQL passed.
concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # read workflow runs for the scorecard checks
      id-token: write # OIDC token for scorecard result publishing
      security-events: write # upload SARIF results to the code scanning tab
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
